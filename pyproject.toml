[project]
name = "ptyx-mcq-editor"
version = "1.2.0"
description = ""
authors = [{ name = "Nicolas Pourcelot", email = "nicolas.pourcelot@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = [
    "python",
    "tikz",
    "latex",
    "pdf",
    "exam",
    "mcq",
    "student",
    "gui",
]
dependencies = [
    "pyqt6-qscintilla>=2.14.1,<3",
    "ptyx-mcq>=31.1.0",
    "tomli-w>=1.0.0,<2",
    "ruff>=0.9.1,<0.10",
    "psutil>=7.0.0,<8",
    "jedi>=0.20.0",
    "pygments>=2.19.2",
]

[project.urls]
Repository = "https://github.com/wxgeo/ptyx-mcq-editor"

[project.scripts]
mcq-editor = "ptyx_mcq_editor.app:main"

[dependency-groups]
dev = [
    "types-psutil",
    "pyqt6-stubs",
]

[tool.uv]

[tool.uv.sources]
ptyx-mcq = { workspace = true, editable = true }
ptyx = { workspace = true, editable = true }

[build-system]
requires = ["uv_build>=0.9.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "ptyx_mcq_editor"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.mypy]
implicit_optional = true
warn_redundant_casts = true
# enable_error_code = true
warn_unused_ignores = true
strict_equality = true
# Warning: exclude strings are handled as regex by mypy!
exclude = ["ptyx_mcq_editor/generated_ui/"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
filterwarnings = [
    'ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning',
    'ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning',
    'ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning',
]

[tool.ruff]
line-length = 110
extend-exclude = ["src/ptyx_mcq_editor/generated_ui/"]




